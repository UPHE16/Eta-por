name: Build Debug APK (Coexist)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup build env
        uses: ./.github/actions/setup-build
      - name: Patch for coexist
        run: |
          sed -i 's/applicationId = "io.github.mangi.eta"/applicationId = "io.github.mangi.eta.por"/' app/build.gradle.kts
          sed -i 's/io.github.mangi.eta.permission.CONTROL_ACCESSIBILITY_PROTECTION/${applicationId}.permission.CONTROL_ACCESSIBILITY_PROTECTION/g' app/src/main/AndroidManifest.xml
          sed -i 's#io.github.mangi.eta.accessibility.health#${applicationId}.accessibility.health#g' app/src/main/AndroidManifest.xml
          sed -i 's#android:taskAffinity="io.github.mangi.eta.virtualscreen"#android:taskAffinity="${applicationId}.virtualscreen"#g' app/src/main/AndroidManifest.xml
          echo "=== applicationId ==="
          grep -n 'applicationId' app/build.gradle.kts | head -3
          echo "=== manifest key lines ==="
          grep -nE 'authorities|CONTROL_ACCESSIBILITY_PROTECTION|taskAffinity' app/src/main/AndroidManifest.xml
          echo "=== source refs to old authority ==="
          grep -rn 'io.github.mangi.eta.accessibility.health' app/src --include=*.kt --include=*.java || true
      - name: Build debug
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-debug-coexist
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
